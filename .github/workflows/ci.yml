name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Create vcpkg binary cache dir
        run: mkdir -p "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}"

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Stage artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp build/rdtp_server build/rdtp_client build/librdtp.a dist/
          cd dist && zip -j ../rdtp-${{ runner.os }}.zip *

      - name: Stage artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/rdtp_server.exe, build/rdtp_client.exe, build/rdtp.lib dist/
          Copy-Item build/*.dll dist/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/* -DestinationPath rdtp-${{ runner.os }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdtp-${{ runner.os }}
          path: rdtp-${{ runner.os }}.zip
          retention-days: 14

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all per-OS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rdtp-*
          path: dist-artifacts
          merge-multiple: true

      - name: Create release with attached zips
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*.zip
          generate_release_notes: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: >
          cppcheck --enable=warning,performance,portability --error-exitcode=1
          --suppress=missingIncludeSystem --inline-suppr
          -I include
          include src examples
